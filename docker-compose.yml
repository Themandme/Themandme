services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: magnolia-postgres
    environment:
      POSTGRES_USER: magnolia
      POSTGRES_PASSWORD: magnolia
      POSTGRES_DB: magnolia
    ports:
      - '5432:5432'
    volumes:
      - magnolia-pgdata:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty data volume.
      # `pnpm db:reset` drops the volume so these re-run.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 matters: during first-time init the entrypoint runs a temporary server on
      # the Unix socket only, so a socket-based pg_isready reports healthy while the scripts in
      # docker-entrypoint-initdb.d are still running. Checking TCP means "healthy" is only
      # reported once the real listener is up and the extensions exist.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U magnolia -d magnolia']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: magnolia-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - magnolia-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  magnolia-pgdata:
  magnolia-redisdata:
