services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: magnolia-postgres
    environment:
      POSTGRES_USER: magnolia
      POSTGRES_PASSWORD: magnolia
      POSTGRES_DB: magnolia
    ports:
      - '5432:5432'
    volumes:
      - magnolia-pgdata:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty data volume.
      # `pnpm db:reset` drops the volume so these re-run.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 matters: during first-time init the entrypoint runs a temporary server on
      # the Unix socket only, so a socket-based pg_isready reports healthy while the scripts in
      # docker-entrypoint-initdb.d are still running. Checking TCP means "healthy" is only
      # reported once the real listener is up and the extensions exist.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U magnolia -d magnolia']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: magnolia-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - magnolia-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ─── Application services ──────────────────────────────────────────────────────────
  #
  # Under the `app` profile, so `docker compose up -d` still brings up ONLY Postgres and Redis —
  # the normal local loop is datastores in containers and the apps on the host with `pnpm dev`,
  # which keeps hot reload. Bring the full stack up with:
  #
  #   docker compose --profile app up -d --build
  #
  # Both services run the same image and differ only in CMD; see the Dockerfile for why.

  migrate:
    profiles: ['app']
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: magnolia-migrate
    # Migrations run as their own service that exits, rather than on api/worker startup. Two
    # replicas racing to apply the same migration is a real failure mode, and "did it migrate?"
    # should be answerable by a container exit code rather than by reading application logs.
    command: ['pnpm', '--filter', '@magnolia/db', 'migrate']
    environment:
      MAGNOLIA_ENV: ${MAGNOLIA_ENV:-local}
      DATABASE_URL: postgres://magnolia:magnolia@postgres:5432/magnolia
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    profiles: ['app']
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: magnolia-api
    command: ['pnpm', '--filter', '@magnolia/api', 'start']
    env_file: [.env]
    environment:
      # Container-network hostnames override whatever .env says for a host-based loop.
      DATABASE_URL: postgres://magnolia:magnolia@postgres:5432/magnolia
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
    ports:
      - '3001:3001'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # /health, not /ready: this is liveness. Pointing a container healthcheck at /ready means a
      # brief Postgres blip marks every replica unhealthy and the orchestrator restarts them all
      # at once, into a database that is already struggling.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    profiles: ['app']
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: magnolia-worker
    command: ['pnpm', '--filter', '@magnolia/worker', 'start']
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://magnolia:magnolia@postgres:5432/magnolia
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # The graceful shutdown in main.ts stops the scheduler, drains in-flight ingest jobs, then
    # closes the pool. Compose's default 10s grace period can cut a paginated fetch in half —
    # not corrupting (both pipeline phases are idempotent) but wasteful.
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  magnolia-pgdata:
  magnolia-redisdata:
