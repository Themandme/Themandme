# Baltimore V1 data sources. Spec §4.5.
#
# Partially verified 2026-08-11 — see docs/SOURCE_VERIFICATION.md for the evidence behind each
# `license_note`. Rows marked VERIFIED were confirmed against the live service on that date;
# rows marked NOT VERIFIED are still placeholders and no adapter should be written against them
# until they are checked.
#
# Verification confirms an endpoint WORKS. It says nothing about whether we are permitted to
# call it — terms of use remain open (spec §17.6) and are counsel's call, not this file's.
#
# Endpoints move and datasets go quiet without announcement (layer 11 on the DHCD service has
# published nothing since 2020 while still being listed). Re-verify before going live.
#
# `enabled: false` on every external source. Adapters are built in M2 and each is turned on
# only after its endpoint has been verified against §4.5.

sources:
  # ── Baltimore City open data ──────────────────────────────────────────────────────────
  - key: baltimore.vbn
    display_name: Vacant Building Notices
    tier: official_record
    access_method: arcgis_rest
    base_url: https://egisdata.baltimorecity.gov/egis/rest/services/Housing/DHCD_Open_Baltimore_Datasets/FeatureServer/1
    scraping_allowed: true
    refresh_cron: '0 6 * * *' # daily
    license_note: >-
      VERIFIED 2026-08-11: 387 notices since 2026-06-01. Fields NoticeNum/DateNotice/
      DateCancel/DateAbate/BLOCKLOT/Address. maxRecordCount 1000, pagination supported.
      See docs/SOURCE_VERIFICATION.md.
    base_confidence: 0.95
    enabled: false

  - key: baltimore.tax_sale
    display_name: Tax Lien Certificate Sale Properties
    tier: official_record
    # Corrected 2026-08-12: this was seeded as `socrata` on data.baltimorecity.gov. It is an
    # ArcGIS MapServer under the Department of Finance folder — same class of error as the SDAT
    # MapServer/FeatureServer correction, i.e. a guess about an endpoint nobody had called.
    access_method: arcgis_rest
    base_url: https://egisdata.baltimorecity.gov/egis/rest/services/DOF/TaxSale/MapServer
    scraping_allowed: true
    refresh_cron: '0 7 * * 1' # weekly in season, else monthly
    license_note: >-
      LOCATED but UNUSABLE as of 2026-08-12. Three layers, newest FY2021; no date field at all
      (TaxSale_Year is null throughout), so the count-query recency probe cannot be applied.
      tax.on_sale_list is a current-state signal and a 2021 snapshot cannot answer it;
      tax.delinquent_balance_cents has no source field here. Stays enabled: false. The live list
      is an annual document — route it through the manual_upload path (M2.6), not an adapter.
      See docs/SOURCE_VERIFICATION.md.
    base_confidence: 0.95
    enabled: false

  - key: baltimore.code_violations
    display_name: Code enforcement / housing citations
    tier: official_record
    access_method: socrata
    base_url: https://data.baltimorecity.gov
    scraping_allowed: true
    refresh_cron: '0 6 * * *'
    license_note: >-
      NOT VERIFIED as of 2026-08-11 — endpoint not located this pass. Feeds
      code.violation_open_count.
    base_confidence: 0.9
    enabled: false

  - key: baltimore.311
    display_name: 311 service requests (occupancy proxies)
    tier: secondary
    access_method: socrata
    base_url: https://data.baltimorecity.gov
    scraping_allowed: true
    refresh_cron: '0 6 * * *'
    # A 311 report is a citizen assertion, not a finding of fact. Weighted accordingly.
    license_note: >-
      NOT VERIFIED as of 2026-08-11. Open Baltimore partitions 311 by CALENDAR YEAR (separate
      2019..2026 datasets), which an adapter must handle and roll over annually. A consolidated
      2021-present layer appeared in search results but returned 404.
    base_confidence: 0.6
    enabled: false

  - key: baltimore.permits
    display_name: Building permits
    tier: official_record
    access_method: arcgis_rest
    base_url: https://egisdata.baltimorecity.gov/egis/rest/services/Housing/DHCD_Open_Baltimore_Datasets/FeatureServer/3
    scraping_allowed: true
    refresh_cron: '0 6 * * *'
    license_note: >-
      VERIFIED 2026-08-11: 3,641 permits issued since 2026-07-01. Date fields IssuedDate,
      ExpirationDate. Layer on the shared DHCD FeatureServer, not a separate Socrata dataset.
    base_confidence: 0.9
    enabled: false

  # Fills a gap: spec §4.4 defines the code.receivership signal but §4.5 names no source
  # that supplies it. Layers 4 (filed/open) and 5 (settled) do.
  - key: baltimore.receivership
    display_name: Receivership petitions - filed and open
    tier: official_record
    access_method: arcgis_rest
    base_url: https://egisdata.baltimorecity.gov/egis/rest/services/Housing/DHCD_Open_Baltimore_Datasets/FeatureServer/4
    scraping_allowed: true
    refresh_cron: '0 7 * * *'
    license_note: >-
      DEAD as of 2026-08-12. Structure is perfect (DateFiled, ReceiverAppointed, DateAuction,
      SoldAtAuction, CaseNumber) but the publication stopped in 2021: DateFiled >= 2021 = 234,
      >= 2022 = 9, >= 2023 = 1, >= 2025 = 0. All four date fields on layer 4 return 0 for
      >= 2024. Layer 5 (Settled) likewise: SoldAtAuction >= 2023 = 0. An earlier note claimed
      these layers closed the §4.4 code.receivership gap; that was inferred from structure
      before recency was measured and is retracted. code.receivership has NO source. Absence of
      the signal is NOT evidence a property is not in receivership. See
      docs/SOURCE_VERIFICATION.md.
    base_confidence: 0.9
    enabled: false

  - key: baltimore.open_bid
    display_name: Open Bid List / Vacants to Value
    tier: official_record
    access_method: arcgis_rest
    base_url: https://egisdata.baltimorecity.gov/egis/rest/services/Housing/DHCD_Open_Baltimore_Datasets/FeatureServer/7
    scraping_allowed: true
    refresh_cron: '0 8 * * 1'
    license_note: >-
      Structure confirmed 2026-08-11 (layer 7, no date fields). Recency NOT measured —
      needs a probe that does not rely on a date column.
    base_confidence: 0.9
    enabled: false

  - key: baltimore.real_property
    display_name: City real property / assessments extract
    tier: official_record
    access_method: arcgis_rest
    base_url: https://egisdata.baltimorecity.gov/egis/rest/services/Housing/DHCD_Open_Baltimore_Datasets/FeatureServer/12
    scraping_allowed: true
    refresh_cron: '0 9 1 * *' # monthly
    license_note: >-
      Structure confirmed 2026-08-11 (layer 12, no date fields). Recency NOT measured.
    base_confidence: 0.95
    enabled: false

  # ── Maryland statewide ────────────────────────────────────────────────────────────────
  - key: md.sdat_parcel_points
    display_name: SDAT parcel points (ownership, valuation, structure)
    tier: official_record
    access_method: arcgis_rest
    base_url: https://mdgeodata.md.gov/imap/rest/services/PlanningCadastre/MD_PropertyData/MapServer/0
    scraping_allowed: true
    refresh_cron: '0 9 2 * *' # monthly, SDAT-sourced
    license_note: >-
      VERIFIED 2026-08-11. MapServer, NOT FeatureServer. Host is mdgeodata.md.gov —
      geodata.md.gov returned HTTP 503. Live maxRecordCount is 2000 (the data.gov catalogue
      advertises 65000). State recommends bulk download via
      .../MapServer/exts/MDiMapDataDownload/customLayers/0. Fields ACCTID/YEARBLT/SQFTSTRC/
      TRADATE/CONSIDR1/NFMTTLVL/DESCLU/OWNADD1..OWNERZIP.
    base_confidence: 0.95
    enabled: false

  - key: md.parcel_boundaries
    display_name: Statewide parcel polygons
    tier: official_record
    access_method: arcgis_rest
    # Host corrected 2026-08-12 to match the verified sibling: geodata.md.gov returned 503.
    base_url: https://mdgeodata.md.gov/imap/rest/services/PlanningCadastre/MD_ParcelBoundaries/MapServer/0
    scraping_allowed: true
    refresh_cron: '0 9 3 1,4,7,10 *' # quarterly — matches the POLYDATE vintage, not a live feed
    license_note: >-
      VERIFIED 2026-08-12. Polygon layer, 222,703 real Baltimore City parcels
      (JURSCODE='BACI' AND CHAR_LENGTH(ACCTID)>8) out of 223,986 polygons. ACCTID is the same
      key as md.sdat_parcel_points, so boundaries join to points and to properties.apn.
      Unblocks parcel adjacency (M2.5, ST_Touches). Adapter MUST: filter ACCTID in
      ('ROW','Water') and NULL (1,283 rows, and they are the FIRST rows returned); treat
      POLYDATE as a String(7) YYYYMMM code ('2024DEC'), NOT a date — comparing it to a
      timestamp returns HTTP 400; paginate (223 pages at maxRecordCount 1000) with the
      Baltimore filter pushed server-side. See docs/SOURCE_VERIFICATION.md.
    base_confidence: 0.95
    enabled: false

  - key: md.sdat_entities
    display_name: SDAT business entity search (LLC -> officers/agent)
    tier: official_record
    access_method: manual_upload
    base_url: https://egov.maryland.gov/businessexpress
    # [VERIFY] Terms not confirmed. On-demand operator lookup until they are.
    scraping_allowed: false
    refresh_cron: null
    base_confidence: 0.9
    enabled: false

  # ── ToS-restricted. Spec §4.5 MUST. ───────────────────────────────────────────────────
  # These two are deliberately manual_upload with scraping_allowed: false.
  #
  # "Manual operator lookup with recorded provenance beats an automated ToS violation."
  # Do not flip either of these without the written terms review in spec §17 item 6.
  - key: md.land_records
    display_name: Land records — deeds, mortgages, liens (mdlandrec.net)
    tier: official_record
    access_method: manual_upload
    base_url: https://mdlandrec.net
    scraping_allowed: false
    license_note: >-
      Credentialed access, terms-restricted. [VERIFY] Until the terms are reviewed in writing,
      access is manual operator lookup only, recorded as a human-tier fact.
    refresh_cron: null
    base_confidence: 0.95
    enabled: false

  - key: md.case_search
    display_name: Maryland Judiciary Case Search (foreclosure dockets)
    tier: official_record
    access_method: manual_upload
    base_url: https://casesearch.courts.state.md.us
    scraping_allowed: false
    license_note: >-
      Terms restrict automated/bulk extraction. [VERIFY] MUST remain scraping_allowed=false and
      manual-lookup-only until the current terms are verified in writing. Spec §4.5.
    refresh_cron: null
    base_confidence: 0.95
    enabled: false

  # ── Internal producers ────────────────────────────────────────────────────────────────
  # facts.source_id is NOT NULL (see packages/db/DIVERGENCES.md), so Magnolia's own facts need
  # a source row to point at. These three cover the non-external tiers of the source_tier enum.
  - key: magnolia.derived
    display_name: Magnolia — derived from other facts
    tier: derived
    access_method: internal
    scraping_allowed: false
    refresh_cron: null
    base_confidence: 0.8
    enabled: true

  - key: magnolia.ai_inference
    display_name: Magnolia — LLM inference
    tier: ai_inference
    access_method: internal
    scraping_allowed: false
    refresh_cron: null
    # Spec §4.2: an ai_inference fact MUST NOT by itself justify spending over $1.00, sending
    # an outbound communication, or advancing a transaction state.
    base_confidence: 0.5
    enabled: true

  - key: magnolia.human
    display_name: Magnolia — operator entry
    tier: human
    access_method: internal
    scraping_allowed: false
    refresh_cron: null
