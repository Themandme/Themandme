# Feature flags. Spec §14.
#
# CLAUDE.md invariant 8: kill switches default OFF for anything that spends money or contacts
# a person. Every flag in this file ships disabled — including the ones that look harmless —
# because the seed is what a fresh production database gets, and the safe state on day one is
# "nothing runs".
#
# The column default is also `false` (packages/db/src/schema/markets.ts), so a flag that is
# missing here is off rather than on. Two layers, same answer.

flags:
  # ── Global and per-channel outbound (§14) ─────────────────────────────────────────────
  - key: outbound.global
    enabled: false
    note: Master kill switch. AT-8 — every channel's send() must reject within 5s of this flipping off.
  - key: outbound.mail
    enabled: false
  - key: outbound.sms
    enabled: false
    note: Requires recorded sms_marketing consent per contact regardless of this flag (§2.1).
  - key: outbound.email
    enabled: false
  - key: outbound.voice_human
    enabled: false
    note: Operator-dialed. One of the two permitted COLD channels (§2.1).
  - key: outbound.voice_ai
    enabled: false
    note: >-
      Inbound and consented-callback ONLY (§2.1). Cold AI voice is a TCPA violation under the
      FCC's Feb 2024 declaratory ruling. This flag does not make cold AI voice permissible.

  # ── Engines ───────────────────────────────────────────────────────────────────────────
  - key: engine.wholesale
    enabled: false
  - key: engine.land
    enabled: false
  - key: engine.recovery
    enabled: false
  - key: engine.recovery.outreach
    enabled: false
    note: >-
      §2.5 — recovery routes may be scored, ranked and displayed, but may NOT be contacted
      until counsel answers whether Magnolia can charge a finder's fee for Maryland surplus
      recovery, under what cap, and with what contract terms. Do not enable without that.

  # ── Cohorts ───────────────────────────────────────────────────────────────────────────
  - key: cohort.absentee_distress
    enabled: false
  - key: cohort.vacant_tax_delinquent
    enabled: false
  - key: cohort.pre_foreclosure
    enabled: false
    note: >-
      §2.3 — Maryland PHIFA. MUST NOT be enabled without a written attorney sign-off recorded
      in audit_log. Ingestion and scoring for this cohort are legitimate (knowing a property is
      in foreclosure is an input to valuation and to NOT contacting someone); what is gated is
      outreach.

  # ── Pipeline stages (§5) ──────────────────────────────────────────────────────────────
  # T0 (free/deterministic) and T1 (cheap automation) have no flags: they spend nothing.
  - key: stage.T2
    enabled: false
    note: LLM reasoning. Costs money per call.
  - key: stage.T3
    enabled: false
    note: Paid data — skip trace, phone validation, title/lien pull.
  - key: stage.T4
    enabled: false
    note: Human — operator review, operator dial, attorney review.

  # ── Sources (§4.5) ────────────────────────────────────────────────────────────────────
  # Each stays off until its endpoint is verified against §4.5 and its adapter has a golden
  # fixture. The two ToS-restricted sources additionally need the written terms review.
  - key: source.baltimore.vbn
    enabled: false
  - key: source.baltimore.tax_sale
    enabled: false
  - key: source.baltimore.code_violations
    enabled: false
  - key: source.baltimore.311
    enabled: false
  - key: source.baltimore.permits
    enabled: false
  - key: source.baltimore.open_bid
    enabled: false
  - key: source.baltimore.real_property
    enabled: false
  - key: source.md.sdat_parcel_points
    enabled: false
  - key: source.md.parcel_boundaries
    enabled: false
  - key: source.md.sdat_entities
    enabled: false
  - key: source.md.land_records
    enabled: false
    note: ToS-restricted, manual upload only until terms are reviewed in writing (§4.5, §17.6).
  - key: source.md.case_search
    enabled: false
    note: ToS-restricted, manual upload only until terms are reviewed in writing (§4.5, §17.6).

  # ── Providers (§9) ────────────────────────────────────────────────────────────────────
  - key: provider.twilio_sms
    enabled: false
  - key: provider.twilio_voice_bridge
    enabled: false
  - key: provider.lob_mail
    enabled: false
  - key: provider.postmark_email
    enabled: false
  - key: provider.bland_voice_ai
    enabled: false
  - key: provider.skiptrace
    enabled: false
  - key: provider.phone_validation
    enabled: false
  - key: provider.llm
    enabled: false
