# Baltimore City, Maryland — the V1 market. Spec §3, §7.1.
#
# CLAUDE.md: market parameters live in config/, never in code. Every value here is read by the
# seed and by services at runtime; none of them has a code-level fallback.

key: baltimore_city_md
display_name: Baltimore City, MD
state_code: MD
fips_county: '24510'
timezone: America/New_York
status: pilot

config:
  # §7.1 lifecycle. No activity for aging_days -> aging; stale_days -> stale. A stale
  # opportunity stops consuming paid stages entirely (T0/T1 only).
  aging_days: 14
  stale_days: 45

  # §8.2 `frequency.cap`. Deny above these. Defaults from the spec text.
  max_touches_per_person_per_week: 3
  max_touches_per_person_per_day: 1

  # §5.1 gate rule 5: T3/T4 denied if the driving signal set is older than this.
  max_signal_age_days: 30

  # §5.1 gate rule 4: cumulative per-opportunity ceiling, alongside route.payout_p50 * 0.15.
  max_spend_per_opportunity_cents: 5000

  # §4.3 entity resolution, tier 3. Both values measured against real data on 2026-08-11; see
  # packages/db/DIVERGENCES.md for the full table.
  #
  # RECALL FLOOR, NOT A MATCH THRESHOLD. Trigram similarity decides which rows are worth
  # examining; it does not decide whether two rows are the same property. That distinction is
  # the whole finding, because the score cannot carry a decision in either direction:
  #
  #   must MATCH                        must REJECT
  #   GUILFORD/GUILFORDD      0.727     LOMBARD/LOMBARDY        0.700
  #   PENNSYLVANIA/PENNSYLVANA 0.667    LIGHT/LIGHTS            0.625
  #   GUILFORD/GUILFRD (typo) 0.545     FAYETTE/LAFAYETTE       0.500
  #   SAINT PAUL/ST PAUL      0.462     PARK/PARKWAY            0.444
  #
  # The two distributions overlap completely — no threshold separates them. Worse, N CHARLES ST
  # vs S CHARLES ST scores 0.786, above every genuine typo, and in Baltimore both exist at the
  # same house number and are different buildings.
  #
  # So the match decision is structural instead: house number, fraction and unit must be EXACTLY
  # equal; directional and suffix must be equal or absent on one side; and the centroid must
  # confirm. 0.30 is set low on purpose — it only has to admit a typo (0.545 is the worst real
  # case above) with margin. Lowering it further costs a few extra rows to examine and cannot
  # produce a merge, because the centroid still has to agree.
  fuzzy_address_threshold: 0.30
  #
  # Kept at 50 m deliberately, and it is now the primary discriminator for the street name.
  #
  #   adjacent rowhouses on one side of a block sit ~4.4-5.5 m apart
  #   across the street is ~70 m; the ends of a 12-parcel block are ~60 m
  #
  # So the radius spans roughly TEN neighbouring houses and is useless at that scale — which is
  # why the house number is pinned structurally rather than confirmed by distance. At STREET
  # scale it is decisive: two differently-named streets are hundreds of metres apart, so it
  # rejects LOMBARD/LOMBARDY (0.700) on geometry where no text score could.
  #
  # Tightening it would not help separate neighbours (they are 5 m apart) and would start
  # rejecting legitimate geocoder variance, which is commonly 10-20 m.
  centroid_confirm_metres: 50

  # §8.2 `calling.window` — local time of the CALLED party, not of the operator.
  calling_window_start_hour: 8
  calling_window_end_hour: 21

  # §6.4 recovery payout = verified_surplus * allowable_fee_rate.
  # [VERIFY] Spec §2.5: whether Magnolia may charge a finder's fee for Maryland surplus
  # recovery at all, under what cap, and with what contract terms is an open question for
  # counsel. This value is deliberately null so that any code reading it fails loudly rather
  # than computing a payout from a guessed rate. Recovery outreach is flag-gated regardless.
  recovery_allowable_fee_rate: null
